$monitor1 = eDP-2
$monitor2 = DP-2
# Workspace binding
workspace = 1, monitor:$monitor1, default:true
workspace = 2, monitor:$monitor1
workspace = 3, monitor:$monitor1
workspace = 4, monitor:$monitor1
workspace = 5, monitor:$monitor1
workspace = 6, monitor:$monitor2, default:true
workspace = 7, monitor:$monitor2
workspace = 8, monitor:$monitor2
workspace = 9, monitor:$monitor2
workspace = 10, monitor:$monitor2

# Smart gaps
workspace = w[tv1]s[false], gapsout:0, gapsin:0
workspace = f[1]s[false], gapsout:0, gapsin:0
windowrule = border_size 0, match:float 0, match:workspace w[tv1]s[false]
windowrule = rounding 0, match:float 0, match:workspace w[tv1]s[false]
windowrule = border_size 0, match:float 0, match:workspace f[1]s[false]
windowrule = rounding 0, match:float 0, match:workspace f[1]s[false]


# Special workspaces
workspace = special:scratchpad, on-created-empty:footclient, name:scratchpad
workspace = special:discord, on-created-empty:discord, name:discord
workspace = special:spotify, on-created-empty:spotify-launcher, name:spotify
workspace = special:terminal, on-created-empty:footclient, name:terminal, decorate:false, shadow:false
