# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER
$altMod = ALT

$terminal = ghostty +new-window
$file_explorer = dolphin
$browser = zen-browser
$drun_launcher = rofi -show drun
$pannel_launcher = killall waybar && waybar
$power_launcher = nwgbar
$change_wallpaper = waypaper --random
$lock_command = hyprlock


# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bindd = $mainMod SHIFT, R, Reloads the hyprland configuration, exec, hyprctl reload
bindd = $mainMod, Return, Opens Terminal in new window, exec, $terminal
bindd = $mainMod, T, Opens Terminal in new window, exec, $terminal
bindd = $mainMod, Q, Kills active window, killactive,
bindd = $mainMod SHIFT, P, Opens Power Menu, exec, $power_launcher
bindd = $mainMod, E, Opens File Explorer, exec, $file_explorer
bindd = $mainMod, space, Toggle floating, togglefloating
binddr = $mainMod, Super_L ,  App launcher, exec, $drun_launcher
bindd = $mainMod, P, Toggle pseudo, pseudo, # dwindle
bindd = $mainMod SHIFT, P, Toggle split, togglesplit, # dwindle
bindd = $mainMod, Home, Restart waybar, exec, $pannel_launcher
bindd = $mainMod, escape, Lock Screen, exec, $lock_command

bindd = $mainMod, B, Open browser, exec, $browser
bindd = $mainMod, F, Toggle fullscreen, fullscreen
# bind = $mainMod SHIFT, F, fakefullscreen
bindd = $mainMod SHIFT,C, Change Wallpaper, exec, $change_wallpaper

# Move focus with mainMod + arrow keys
bindd = $mainMod, left, Focus left, movefocus, l
bindd = $mainMod, H, Focus left, movefocus, l
bindd = $mainMod, right, Focus right, movefocus, r
bindd = $mainMod, L, Focus right, movefocus, r
bindd = $mainMod, up, Focus up, movefocus, u
bindd = $mainMod, K, Focus up, movefocus, u
bindd = $mainMod, down, Focus down, movefocus, d
bindd = $mainMod, J, Focus down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bindd = $mainMod, 1, Workspace 1, workspace, 1
bindd = $mainMod, 2, Workspace 2, workspace, 2
bindd = $mainMod, 3, Workspace 3, workspace, 3
bindd = $mainMod, 4, Workspace 4, workspace, 4
bindd = $mainMod, 5, Workspace 5, workspace, 5
bindd = $mainMod, 6, Workspace 6, workspace, 6
bindd = $mainMod, 7, Workspace 7, workspace, 7
bindd = $mainMod, 8, Workspace 8, workspace, 8
bindd = $mainMod, 9, Workspace 9, workspace, 9
bindd = $mainMod, 0, Workspace 10, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bindd = $mainMod SHIFT, 1, Move window to workspace 1, movetoworkspacesilent, 1
bindd = $mainMod SHIFT, 2, Move window to workspace 2, movetoworkspacesilent, 2
bindd = $mainMod SHIFT, 3, Move window to workspace 3, movetoworkspacesilent, 3
bindd = $mainMod SHIFT, 4, Move window to workspace 4, movetoworkspacesilent, 4
bindd = $mainMod SHIFT, 5, Move window to workspace 5, movetoworkspacesilent, 5
bindd = $mainMod SHIFT, 6, Move window to workspace 6, movetoworkspacesilent, 6
bindd = $mainMod SHIFT, 7, Move window to workspace 7, movetoworkspacesilent, 7
bindd = $mainMod SHIFT, 8, Move window to workspace 8, movetoworkspacesilent, 8
bindd = $mainMod SHIFT, 9, Move window to workspace 9, movetoworkspacesilent, 9
bindd = $mainMod SHIFT, 0, Move window to workspace 10, movetoworkspacesilent, 10

bindd = $mainMod, minus, Toggle scratchpad, togglespecialworkspace, scratchpad
bindd = $mainMod SHIFT, minus, Move window to scratchpad, movetoworkspacesilent, special:scratchpad

bindd = $mainMod, D, Toggle Discord workspace, togglespecialworkspace, discord
bindd = $mainMod, S, Toggle Spotify workspace, togglespecialworkspace, spotify

# Scroll through existing workspaces with mainMod + scroll
bindd = $mainMod, mouse_down, Workspace next, workspace, m+1
bindd = $mainMod, mouse_up, Workspace prev, workspace, m-1

# Move/resize windows with mainMod + LMB/RMB and dragging
binddm = $mainMod, mouse:272, Move window (drag), movewindow  # left mouse
binddm = $mainMod, mouse:273, Resize window (drag), resizewindow # right mouse


# set volume (laptops only and may or may not work on PCs)
binddlepu = , XF86AudioLowerVolume, Volume down, exec, pamixer --decrease 5; notify-send " Volume: "$(pamixer --get-volume) -t 500
binddlepu = , XF86AudioRaiseVolume, Volume up, exec, pamixer --increase 5; notify-send " Volume: "$(pamixer --get-volume) -t 500
binddlepu = , XF86AudioMute, Toggle mute, exec, pamixer --toggle-mute; notify-send " Volume: Toggle-mute" -t 500
# set monitor brightness
binddlepu = , XF86MonBrightnessDown, Brightness down, exec, brightnessctl -c backlight set 5%-
binddlepu = , XF86MonBrightnessUp, Brightness up, exec, brightnessctl -c backlight set +5%
# video play paues bindings
binddlpu = , XF86AudioPlay, Play/pause, exec, playerctl play-pause
binddlpu = , XF86AudioNext, Next track, exec, playerctl next
binddlpu = , XF86AudioPrev, Previous track, exec, playerctl previous


# Screenshots:
# SHIFT+Print: All outputs
# Print: Select area
# $mainMod+Shfit+Print: Select area
# $mainMod+Print: Current window
# $mainMod+Shfit+Print: Current output

binddlpu = SHIFT, Print, Screenshot all outputs, exec, ~/.config/hypr/scripts/screenshot.sh screen
binddlpu = , Print, Screenshot area, exec, ~/.config/hypr/scripts/screenshot.sh area
binddlpu = $mainMod SHIFT, S, Screenshot area (mainMod), exec, ~/.config/hypr/scripts/screenshot.sh area
binddlpu = $mainMod, Print, Screenshot active window, exec, ~/.config/hypr/scripts/screenshot.sh active
binddlpu = $mainMod SHIFT, Print, Screenshot output, exec, ~/.config/hypr/scripts/screenshot.sh output



# to move window
bindd = $mainMod SHIFT,up, Move window up, movewindow, u
bindd = $mainMod SHIFT,K, Move window up, movewindow, u
bindd = $mainMod SHIFT,down, Move window down, movewindow, d
bindd = $mainMod SHIFT,J, Move window down, movewindow, d
bindd = $mainMod SHIFT,left, Move window left, movewindow, l
bindd = $mainMod SHIFT,H, Move window left, movewindow, l
bindd = $mainMod SHIFT,right, Move window right, movewindow, r
bindd = $mainMod SHIFT,L, Move window right, movewindow, r





# ---------------------------------------------------------------------------------------------------------------
# for resizing window
# will switch to a submap called resize
bindd = $mainMod, R, Enter resize submap, submap, resize
submap=resize
# sets repeatable binds for resizing the active window
bindde = , right, Resize right, resizeactive, 50 0
bindde = , L, Resize right (vim), resizeactive, 50 0
bindde = , left, Resize left, resizeactive, -50 0
bindde = , H, Resize left (vim), resizeactive, -50 0
bindde = , up, Resize up, resizeactive, 0 -50
bindde = , K, Resize up (vim), resizeactive, 0 -50
bindde = , down, Resize down, resizeactive, 0 50
bindde = , J, Resize down (vim), resizeactive, 0 50
# use reset to go back to the global submap
bindd = , escape, Exit submap, submap, reset

submap=reset
# ---------------------------------------------------------------------------------------------------------------


# Alt Passthrough
# ---------------------------------------------------------------------------------------------------------------
# Enter passthrough mode
bindd = $mainMod, F12, Enter passthrough submap, submap, passthru

# Define the passthrough submap
submap = passthru
bindd = $mainMod, F12, Exit passthrough submap, submap, reset
bindd = $mainMod, Escape, Exit passthrough submap, submap, reset
submap = reset
# ----------------------------------------------------------------------------------------------------------------

