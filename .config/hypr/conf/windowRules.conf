# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

windowrule {
    name = discord
    match:initial_title = (.*)(Discord)(.*)
    workspace = workspace silent special:discord silent
}

windowrule {
    name = spotify
    match:class = Spotify
    workspace = workspace silent special:spotify
}

windowrule {
    name = xwayland-video-bridge-fixes
    match:class = xwaylandvideobridge

    no_initial_focus = true
    no_focus = true
    no_anim = true
    no_blur = true
    max_size = 1 1
    opacity = 0.0
}


# https://wiki.hypr.land/Configuring/Window-Rules/#layer-rules

layerrule = blur on, match:namespace waybar
