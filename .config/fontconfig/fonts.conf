<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM '/usr/share/xml/fontconfig/fonts.dtd'>
<fontconfig>
 <!-- Base font configuration -->
 <alias binding="strong">
  <family>sans-serif</family>
  <prefer>
   <family>FiraCode</family>
  </prefer>
 </alias>
 <alias binding="strong">
  <family>serif</family>
  <prefer>
   <family>FiraCode</family>
  </prefer>
 </alias>
 <alias binding="strong">
  <family>monospace</family>
  <prefer>
   <family>FiraCode Nerd Font</family>
  </prefer>
 </alias>
 <!-- Devanagari settings -->
 <match>
  <test compare="contains" name="lang">
   <string>ne</string>
  </test>
  <edit binding="strong" mode="prepend" name="family">
   <string>Lohit Devanagari</string>
  </edit>
 </match>
 <!-- Nerd Font override -->
 <match target="pattern">
  <test name="family">
   <string>monospace</string>
  </test>
  <test compare="contains" name="charset">
   <charset>
    <range>
     <int>0x1f300</int>
     <int>0x1f5ff</int>
    </range>
   </charset>
  </test>
  <edit mode="prepend" name="family">
   <string>FiraCode Nerd Font</string>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="rgba">
   <const>none</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>false</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintnone</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="rgba">
   <const>none</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="rgba">
   <const>none</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintmedium</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="rgba">
   <const>none</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintfull</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
 <dir>~/.local/share/fonts</dir>
</fontconfig>
