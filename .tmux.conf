# ~/.tmux.conf

# remap prefix to C-a (easier than C-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# reload config
unbind r
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"

# ── terminal ────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"  # true color
set -g escape-time 0                              # instant <Esc> in nvim
set -g focus-events on                            # gitsigns/autoread work correctly

# ── indexing ────────────────────────────────────────────────────
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# ── mouse ───────────────────────────────────────────────────────
set -g mouse on

# ── splits (open in current path) ───────────────────────────────
unbind %
unbind '"'
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ── vim-style pane navigation ───────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── pane resize ─────────────────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── copy mode (vim keys) ─────────────────────────────────────────
set -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# ── windows ─────────────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind n next-window
bind p previous-window

# --- sessions --------------------
bind N command-prompt -p "New session:" "new-session -As '%%'"

# ── status bar ──────────────────────────────────────────────────
set -g status-position top
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 60

set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[fg=#89b4fa,bold] #S #[fg=#45475a]│ "
set -g status-right "#[fg=#a6adc8] %H:%M #[fg=#45475a]│ #[fg=#89b4fa]#h "

set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W "
set -g window-status-style "fg=#6c7086"

# pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# ── history ─────────────────────────────────────────────────────
set -g history-limit 10000
